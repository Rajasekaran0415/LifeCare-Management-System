<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeCare | My Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a2a6c 0%, #007bff 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: none;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #0dcaf0 0%, #007bff 100%);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .avatar-circle {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            border-radius: 50%;
            margin: 0 auto 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px dashed #dee2e6;
        }

        .detail-row .label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6c757d;
        }

        .detail-row .value {
            font-weight: 600;
            color: #1a2a6c;
        }

        .btn-profile-menu {
            background: linear-gradient(135deg, #0dcaf0 0%, #007bff 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
        }

        .btn-profile-menu:hover {
            opacity: 0.9;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="profile-card animate__animated animate__fadeInUp">
    <div class="profile-header">
        <img src="logo.png" alt="LifeCare" height="45" class="mb-3">
        <div class="avatar-circle" id="avatarCircle">U</div>
        <h3 class="fw-bold mb-1" id="profileName">User</h3>
        <p class="small mb-0 opacity-75" id="profileRole">Patient Portal</p>
    </div>

    <div class="p-4 p-md-5">
        <h5 class="fw-bold text-dark mb-3 border-start border-info border-5 ps-3">Profile Details</h5>
        <div id="detailsContainer">
            <div class="detail-row">
                <span class="label"><i class="bi bi-person-badge me-2 text-info"></i>Patient ID</span>
                <span class="value" id="dId">-</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="bi bi-person-circle me-2 text-info"></i>Login ID</span>
                <span class="value" id="dLoginId">-</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="bi bi-person-vcard me-2 text-info"></i>Full Name</span>
                <span class="value" id="dName">-</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="bi bi-calendar-event me-2 text-info"></i>Age</span>
                <span class="value" id="dAge">-</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="bi bi-gender-ambiguous me-2 text-info"></i>Gender</span>
                <span class="value" id="dGender">-</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="bi bi-speedometer2 me-2 text-info"></i>Weight</span>
                <span class="value" id="dWeight">-</span>
            </div>
            <div class="detail-row">
                <span class="label"><i class="bi bi-droplet-fill text-danger me-2"></i>Blood Group</span>
                <span class="value" id="dBloodgroup">-</span>
            </div>
        </div>

        <div class="row g-2 mt-4">
            <div class="col-md-6">
                <a href="bookAppointment.html" class="btn btn-profile-menu w-100 shadow-sm">
                    <i class="bi bi-calendar-plus me-2"></i>Book Appointment
                </a>
            </div>
            <div class="col-md-6">
                <a href="index.html" class="btn btn-profile-menu w-100 shadow-sm">
                    <i class="bi bi-house-door me-2"></i>Back to Home
                </a>
            </div>
        </div>

        <div class="text-center mt-3">
            <button class="btn btn-sm btn-outline-danger rounded-pill px-4" id="profileLogout">
                <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const profile = JSON.parse(sessionStorage.getItem("patientProfile") || "null");
        const patientId = sessionStorage.getItem("patientId");
        const patientName = sessionStorage.getItem("patientName");

        const getName = () => (profile && profile.name) || patientName || "";
        const name = getName();

        if (!name && !sessionStorage.getItem("nurseLoggedIn")) {
            window.location.href = "login.html";
            return;
        }

        const role = sessionStorage.getItem("nurseLoggedIn")
            ? "Nurse @ " + (sessionStorage.getItem("nurseHospital") || "LifeCare")
            : "Patient Portal";

        const initials = (name || "U").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

        document.getElementById("avatarCircle").textContent = initials;
        document.getElementById("profileName").textContent = name || "User";
        document.getElementById("profileRole").textContent = role;

        if (sessionStorage.getItem("nurseLoggedIn")) {
            document.getElementById("dId").textContent = "-";
            document.getElementById("dName").textContent = sessionStorage.getItem("nurseName") || name;
            document.getElementById("dLoginId").textContent = sessionStorage.getItem("nurseName") || "-";
            return;
        }

        const set = (id, val) => { document.getElementById(id).textContent = val || "-"; };

        set("dId", profile ? profile.id : patientId);
        set("dLoginId", profile ? profile.loginId : "-");
        set("dName", profile ? profile.name : patientName);
        set("dAge", profile ? profile.age : "-");
        set("dGender", profile ? profile.gender : "-");
        set("dWeight", profile ? (profile.weight !== undefined ? profile.weight + " kg" : "-") : "-");
        set("dBloodgroup", profile ? profile.bloodgroup : "-");
    });

    document.getElementById("profileLogout").addEventListener("click", function (e) {
        if (e) e.preventDefault();
        sessionStorage.clear();
        window.location.href = "index.html";
    });
</script>

</body>
</html>
